[project]
name = "kami-drills"
version = "1.0.0rc1"
description = "Offline decision drills forked from real Kamigotchi agent transcripts, scored by deterministic rules (Inspect)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.280",
    "openai==3.31.0",
]

[project.scripts]
kami-drills = "kami_drills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kami_drills"]
